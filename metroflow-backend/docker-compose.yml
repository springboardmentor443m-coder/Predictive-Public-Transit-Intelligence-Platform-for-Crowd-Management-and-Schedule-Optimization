version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - metroflow_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: sqlite
    volumes:
      - metroflow_data:/data
    restart: unless-stopped

volumes:
  metroflow_data:
