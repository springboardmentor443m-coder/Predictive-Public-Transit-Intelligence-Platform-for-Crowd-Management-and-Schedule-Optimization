apiVersion: v1
kind: Namespace
metadata:
  name: metroflow
---
apiVersion: v1
kind: Secret
metadata:
  name: metroflow-secrets
  namespace: metroflow
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg2://metroflow:metroflow@postgres:5432/metroflow
  MONGODB_URL: mongodb://mongo:27017
  REDIS_URL: redis://redis:6379/0
  # Rotate before real deployments (kubectl create secret / eyes to KMS/SOPS).
  JWT_SECRET_KEY: change-me-in-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: metroflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: metroflow }
            - { name: POSTGRES_PASSWORD, value: metroflow }
            - { name: POSTGRES_DB, value: metroflow }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: pgdata
          persistentVolumeClaim: { claimName: pgdata }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: metroflow
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: metroflow
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: metroflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports: [{ containerPort: 27017 }]
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: metroflow
spec:
  selector: { app: mongo }
  ports: [{ port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: metroflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: metroflow
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: metroflow
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: metroflow/backend:latest
          envFrom:
            - secretRef: { name: metroflow-secrets }
          env:
            - { name: METROFLOW_MODEL_CITY, value: hangzhou }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: metroflow
spec:
  type: ClusterIP
  selector: { app: backend }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: metroflow
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: metroflow/frontend:latest
          env:
            # NEXT_PUBLIC_* values are baked at IMAGE BUILD time. Build the
            # frontend image with `--build-arg NEXT_PUBLIC_API_URL=""` so the
            # client bundle uses same-origin URLs. The Next server (next start)
            # reads BACKEND_INTERNAL_URL at runtime to proxy /api/v1 and
            # /socket.io to the in-cluster backend.
            - { name: BACKEND_INTERNAL_URL, value: http://backend.metroflow.svc.cluster.local:8000 }
          ports: [{ containerPort: 3000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: metroflow
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 3000 }]
