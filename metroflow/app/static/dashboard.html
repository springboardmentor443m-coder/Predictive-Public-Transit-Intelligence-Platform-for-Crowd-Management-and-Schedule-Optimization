.login-wrap{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(100%,420px);padding:34px;border:1px solid var(--line);background:#111c2df2;border-radius:24px;box-shadow:var(--shadow)}.logo{display:flex;align-items:center;gap:11px;font:700 22px 'Space Grotesk',sans-serif}.logo-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#5eead4,#60a5fa);color:#071321;display:grid;place-items:center;font-weight:800}.login-card h1{font-size:29px;margin:24px 0 8px}.field{display:grid;gap:7px;margin:14px 0;color:var(--muted);font-size:12px}.field input,.field select,.field textarea,select,input{background:#0b1525;border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}.btn{border:1px solid var(--line);background:#1a2940;border-radius:10px;padding:10px 14px;font-weight:700;transition:.2s}.btn:hover{border-color:#5c86b9;transform:translateY(-1px)}.btn.primary{background:var(--blue);color:#081322;border-color:transparent}.btn.ghost{background:transparent}.btn.danger{color:var(--red)}.login-card .btn{width:100%;margin-top:10px}.error{color:var(--red);min-height:20px}
.topbar{position:sticky;top:0;z-index:10;background:#0b1220eF;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.top-inner{max-width:1500px;margin:auto;padding:13px 26px;display:flex;align-items:center;gap:24px}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;white-space:nowrap}.brand small{display:block;font:500 10px 'DM Sans',sans-serif;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}.nav{display:flex;gap:5px;flex:1;overflow:auto}.nav button{background:transparent;border:0;color:var(--muted);padding:10px 12px;border-radius:9px;white-space:nowrap;font-size:12px;font-weight:700}.nav button.active,.nav button:hover{background:#1a2b42;color:var(--text)}.toolbar{display:flex;align-items:center;gap:8px}.toolbar input,.toolbar select{padding:8px 9px;font-size:12px}.userchip{border-left:1px solid var(--line);padding-left:13px;color:var(--muted);font-size:11px;white-space:nowrap}.container{max-width:1500px;margin:auto;padding:27px 26px 50px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}.page-head h1{font-size:clamp(25px,3vw,35px);letter-spacing:-.04em;margin:4px 0}.page-head p{color:var(--muted);margin:0}.head-actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:15px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.metric-card,.card{background:linear-gradient(145deg,#142238,#101a2a);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.metric-card{padding:18px;position:relative;overflow:hidden}.metric-card:after{content:'';position:absolute;width:95px;height:95px;border-radius:50%;right:-35px;top:-38px;background:#65a9ff0d}.metric-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.metric-icon{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:#203753;color:var(--blue);font-size:16px}.metric{font-size:clamp(25px,2.4vw,34px);font-weight:700;letter-spacing:-.04em;line-height:1.2;margin:15px 0 7px}.metric-foot{font-size:11px;color:var(--muted)}.card{padding:20px;min-width:0}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px}.card-head h2{font-size:16px;margin:0 0 3px}.card-head p{margin:0;color:var(--muted);font-size:11px}.split{grid-template-columns:minmax(0,1.55fr) minmax(310px,1fr);align-items:start}.two{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.section-gap{margin-top:16px}.station-list{display:grid;gap:13px}.station-row{display:grid;grid-template-columns:minmax(120px,1.15fr) minmax(80px,2fr) 55px;gap:12px;align-items:center}.station-name{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.station-sub{font-size:10px;color:var(--muted)}.bar{height:7px;border-radius:9px;background:#24344a;overflow:hidden}.bar i{height:100%;display:block;border-radius:9px;background:var(--green)}.bar .mod{background:var(--amber)}.bar .high{background:var(--orange)}.bar .crit{background:var(--red)}.percent{text-align:right;font:600 13px 'Space Grotesk',sans-serif}.alert-list{display:grid;gap:9px}.alert-item{padding:12px 13px;border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;background:#101a2a}.alert-item.critical{border-left-color:var(--red)}.alert-item .alert-title{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700}.alert-item p{font-size:11px;color:var(--muted);margin:6px 0 0}.empty{padding:24px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:12px}.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:10px}.legend span{display:flex;align-items:center;gap:5px}.swatch{width:7px;height:7px;border-radius:2px;background:currentColor}.heat-wrap{overflow:auto}.heatmap{display:grid;grid-template-columns:160px repeat(24,minmax(20px,1fr));gap:3px;min-width:790px}.heat-label{font-size:10px;color:var(--muted);text-align:center}.heat-station{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:center;color:#dce7f5}.heat-cell{height:23px;border-radius:4px;background:#1e9e6a;opacity:.95}.heat-cell:hover{outline:1px solid white}.table-wrap{overflow:auto;max-height:460px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:11px 12px;border-bottom:1px solid #24344a;text-align:left}th{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:#132036;z-index:1}tbody tr:hover{background:#ffffff06}.status{font-size:10px;font-weight:700}.forecast-controls{display:flex;gap:6px;flex-wrap:wrap}.forecast-controls button{padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:11px;font-weight:700}.forecast-controls button.active{background:#234263;border-color:#4b8ed7;color:#e8f4ff}.horizon-value{font:700 30px 'Space Grotesk',sans-serif;letter-spacing:-.04em}.horizon-card{padding:17px;border:1px solid var(--line);border-radius:13px;background:#0d1727}.horizon-card.selected{border-color:var(--blue);box-shadow:inset 0 0 0 1px #65a9ff44}.horizon-card .label{color:var(--muted);font-size:11px}.horizon-card .small{font-size:11px;color:var(--muted);margin-top:5px}.spark{width:100%;height:190px;display:block}.schedule-row{display:grid;grid-template-columns:65px 1fr 55px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #26364d;font-size:12px}.schedule-row:last-child{border-bottom:0}.schedule-time{font-weight:700}.schedule-line{height:5px;border-radius:5px;background:#26364d;overflow:hidden}.schedule-line i{display:block;height:100%;background:var(--blue)}.schedule-meta{text-align:right;color:var(--muted);font-size:11px}.select-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.select-row label{color:var(--muted);font-size:11px}.select-row select{padding:8px 10px}.notice{padding:12px 14px;border-radius:11px;background:#152b43;border:1px solid #294c70;color:#b8d7fa;font-size:11px}.notice.warning{background:#342719;border-color:#765123;color:#ffdfa1}.loading{padding:45px;text-align:center;color:var(--muted)}.spinner{display:inline-block;width:18px;height:18px;border:2px solid #33465e;border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}.footer{margin-top:22px;display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:10px}.toast{position:fixed;right:20px;bottom:20px;z-index:30;background:#1b3048;border:1px solid #416182;padding:12px 16px;border-radius:11px;box-shadow:var(--shadow);max-width:340px}.divider{border:0;border-top:1px solid var(--line);margin:17px 0}
@media(max-width:1120px){.top-inner{flex-wrap:wrap;gap:12px}.nav{order:3;flex-basis:100%}.toolbar{margin-left:auto}.split{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.top-inner{padding:12px 15px}.container{padding:22px 14px 36px}.toolbar{width:100%;flex-wrap:wrap;margin:0}.toolbar label{display:flex;align-items:center;gap:5px;font-size:10px}.toolbar input,.toolbar select{max-width:140px}.userchip{display:none}.nav button{padding:8px 10px}.metrics,.two,.three{grid-template-columns:1fr}.metric-card{padding:15px}.card{padding:15px}.page-head{align-items:flex-start;flex-direction:column}.station-row{grid-template-columns:minmax(100px,1.2fr) minmax(60px,1fr) 45px;gap:8px}.heatmap{grid-template-columns:130px repeat(24,minmax(18px,1fr))}.footer{flex-direction:column}}

@media(max-width:760px){.top-inner{align-items:flex-start;flex-wrap:wrap;gap:10px}.brand{min-width:100%}.nav{order:3;flex-basis:100%;width:100%}.toolbar{flex-wrap:wrap}.container{padding:18px 12px 34px}.card{padding:14px}.page-head{align-items:flex-start;flex-direction:column}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:1fr}.grid.two,.grid.split{grid-template-columns:1fr}.userchip{display:none}}

<body>
<section id="login" class="login-wrap"><form id="loginForm" class="login-card"><div class="logo"><span class="logo-mark">M</span><span>MetroFlow<small class="muted" style="display:block;font:500 10px 'DM Sans';letter-spacing:.12em;text-transform:uppercase">Operations intelligence</small></span></div><h1>See the network<br>before it moves.</h1><p class="muted">Sign in to monitor station crowding, forecast demand, and plan train frequency.</p><label class="field">Username<input name="username" autocomplete="username" placeholder="Enter username" required></label><label class="field">Password<input name="password" type="password" autocomplete="current-password" placeholder="Enter password" required></label><button class="btn primary" type="submit">Sign in to MetroFlow ↗</button><p id="loginErr" class="error" role="alert"></p><p class="tiny muted">Demo: admin / admin123 · operator1 / operator123</p></form></section>
<div id="shell" hidden><header class="topbar"><div class="top-inner"><div class="brand"><span class="logo-mark">M</span><span>MetroFlow<small>Network control center</small></span></div><nav class="nav" id="tabs"><button data-view="overview" class="active">Overview</button><button data-view="simulation">Live simulator</button><button data-view="forecast">Forecast & schedules</button><button data-view="heatmap">Crowd heatmap</button><button data-view="alerts">Alerts center</button><button data-view="analytics">Analytics</button></nav><div class="toolbar"><label class="tiny muted">Date <input type="date" id="date" aria-label="Data date"></label><label class="tiny muted">Hour <select id="hour" aria-label="Selected hour"></select></label><span id="who" class="userchip"></span><button id="logout" class="btn ghost" title="Sign out">↗</button></div></div></header><main id="view" class="container" aria-live="polite"></main></div><div id="toast" class="toast" hidden></div>
<script>
const Api=(()=>{const KEY='mf_token';const token=()=>sessionStorage.getItem(KEY);async function req(path,params={},opts={}){const qs=new URLSearchParams(Object.entries(params).filter(([,v])=>v!==''&&v!=null)).toString();const headers={...(token()?{Authorization:'Bearer '+token()}:{}),...(opts.headers||{})};if(opts.body&&!(opts.body instanceof URLSearchParams))headers['Content-Type']='application/json';const res=await fetch(path+(qs?'?'+qs:''),{...opts,headers});if(res.status===401&&token()){sessionStorage.removeItem(KEY);location.reload()}const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(typeof body.detail==='string'?body.detail:'Request failed ('+res.status+')');return body}return{get:req,hasToken:()=>!!token(),async login(username,password){const t=await req('/auth/login',{}, {method:'POST',body:new URLSearchParams({username,password})});sessionStorage.setItem(KEY,t.access_token)},logout(){sessionStorage.removeItem(KEY)}}})();
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0}),pct=n=>`${Number(n||0).toFixed(1)}%`,enc=encodeURIComponent;
const band=p=>p<40?'low':p<70?'mod':p<90?'high':'crit',bandName=p=>p<40?'Low':p<70?'Moderate':p<90?'High':'Critical';const st={user:null,view:'overview',station:null,stations:[],capacity:{},refreshAt:null,horizon:15,simTick:0};const ctx=()=>({on_date:$('#date').value,hour:$('#hour').value});const none=()=>({alerts:[]});
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;setTimeout(()=>t.hidden=true,3200)}
function metric(label,value,foot,icon='◈',color='blue'){return `<article class="metric-card"><div class="metric-top"><span>${label}</span><span class="metric-icon ${color}">${icon}</span></div><div class="metric">${value}</div><div class="metric-foot">${foot}</div></article>`}
function pageHead(title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">MetroFlow / ${esc(st.view)}</div><h1>${title}</h1><p>${sub}</p></div><div class="head-actions">${action}</div></div>`}
function cardHead(title,sub='',right=''){return `<div class="card-head"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${right}</div>`}
function alertCard(a){const critical=/critical|emergency/i.test(a.severity||'');return `<article class="alert-item ${critical?'critical':''}"><div class="alert-title"><span>${esc(a.station||'Network alert')} · ${esc((a.type||'ALERT').replaceAll('_',' '))}</span><span class="${critical?'crit':'mod'}">${esc(a.severity||'Notice')}</span></div><p>${esc(a.message||'Review this service condition.')}</p>${a.hour!=null?`<p>Forecast hour: ${esc(a.hour)}:00${a.predicted_congestion_pct!=null?' · '+pct(a.predicted_congestion_pct)+' predicted':''}</p>`:''}</article>`}
function stationRows(rows){if(!rows.length)return '<div class="empty">No station data available for this selection.</div>';return `<div class="station-list">${rows.map(r=>{const p=Number(r.congestion_pct||0),b=band(p);return `<div class="station-row"><div><div class="station-name">${esc(r.station)}</div><div class="station-sub">${fmt(r.entries)} entries · ${fmt(r.exits)} exits</div></div><div class="bar"><i class="${b}" style="width:${Math.min(100,Math.max(0,p))}%"></i></div><div class="percent ${b}">${p.toFixed(0)}%</div></div>`}).join('')}</div>`}
function empty(msg){return `<div class="empty">${msg}</div>`}
const views={
 async overview(){
  const c=ctx();
  const [historical,over,delays,sim]=await Promise.all([
   Api.get('/crowd/live',c),Api.get('/alerts/overcrowding',c).catch(none),
   Api.get('/alerts/delays',c).catch(none),Api.get('/simulation/live').catch(()=>({running:false,stations:[],alerts:[],notice:'Simulation endpoint unavailable.'}))
  ]);
  const live=sim.running?{...historical,...sim,date:'SIMULATED LIVE',hour:new Date().getHours()}:historical;
  const rows=[...(live.stations||[])].sort((a,b)=>b.congestion_pct-a.congestion_pct);
  const alerts=sim.running?[...(sim.alerts||[])]:[...(over.alerts||[]),...(delays.alerts||[])];
  alerts.sort((a,b)=>(b.severity==='Critical')-(a.severity==='Critical'));
  const critical=rows.filter(r=>r.congestion_pct>=90).length,hot=rows.filter(r=>r.congestion_pct>=70).length;
  st.refreshAt=new Date();st.simRunning=!!sim.running;st.simTick=sim.tick||0;
  const simPanel=`<section class="card section-gap">${cardHead('Simulated-live data stream',sim.running?`Running · tick ${sim.tick} · updated ${sim.updated_at?new Date(sim.updated_at).toLocaleTimeString():'starting'}`:'Stopped · historical snapshot mode',`<span class="pill ${sim.running?'low':'mod'}">${sim.running?'SIMULATION ON':'SIMULATION OFF'}</span>`)}<div class="notice ${sim.running?'':'warning'}">${esc(sim.notice||'Simulated demo data only; not connected to a real metro feed.')}</div><div class="head-actions" style="justify-content:flex-start;margin-top:12px"><button class="btn primary" data-action="simulation-start" ${sim.running?'disabled':''}>▶ Start simulation</button><button class="btn" data-action="simulation-stop" ${sim.running?'':'disabled'}>■ Stop simulation</button><label class="tiny muted">Scenario <select id="simulationScenario" ${st.user?.role!=='admin'?'disabled':''}><option value="normal" ${sim.scenario==='normal'?'selected':''}>Normal operations</option><option value="rush_hour" ${sim.scenario==='rush_hour'?'selected':''}>Rush hour</option><option value="demand_surge" ${sim.scenario==='demand_surge'?'selected':''}>Demand surge</option><option value="service_disruption" ${sim.scenario==='service_disruption'?'selected':''}>Service disruption</option></select></label><button class="btn" data-action="simulation-scenario" ${st.user?.role!=='admin'?'disabled':''}>Apply scenario</button><span class="tiny muted">Refresh interval: ${sim.interval_seconds||5}s</span></div><p class="tiny muted" style="margin-top:10px">Scenario controls generate demo conditions only. No actual timetable or train movement is changed.</p>${sim.history?.length?`<div class="table-wrap section-gap"><table><thead><tr><th>Tick</th><th>Updated</th><th>Scenario</th><th>Entries</th><th>Exits</th><th>High crowd stations</th><th>Alerts</th></tr></thead><tbody>${sim.history.slice(-6).reverse().map(h=>`<tr><td>${h.tick}</td><td>${h.updated_at?new Date(h.updated_at).toLocaleTimeString():'—'}</td><td>${esc((h.scenario||'normal').replaceAll('_',' '))}</td><td>${fmt(h.system_total_entries)}</td><td>${fmt(h.system_total_exits)}</td><td>${h.high_crowd_stations}</td><td>${h.alert_count}</td></tr>`).join('')}</tbody></table></div>`:''}</section>`;
  return `${pageHead('Network overview',sim.running?'Simulated passenger counts refresh automatically.':'Operational picture for the selected historical dataset hour.',`<button class="btn" data-action="refresh">↻ Refresh data</button>`)}${simPanel}<div class="grid metrics">${metric('Passenger entries',fmt(live.system_total_entries??rows.reduce((n,r)=>n+r.entries,0)),sim.running?'Simulated current snapshot':'Selected historical hour','↗')}${metric('Passenger exits',fmt(live.system_total_exits??rows.reduce((n,r)=>n+r.exits,0)),sim.running?'Simulated current snapshot':'Selected historical hour','↙','blue')}${metric('High crowd stations',hot,`${critical} at critical (90%+)`,'⚠',hot?'high':'low')}${metric('Active alerts',alerts.length,sim.running?'Generated from simulated readings':'Crowding and recorded delays','◉',alerts.length?'high':'low')}</div><div class="grid split section-gap"><section class="card">${cardHead('Station crowd index',`${sim.running?'Simulated snapshot':esc(live.date)} · ${String(live.hour).padStart(2,'0')}:00`, `<span class="pill blue">${rows.length} stations</span>`)}${stationRows(rows)}<div class="legend" style="margin-top:17px"><span class="low"><i class="swatch"></i>Low &lt;40%</span><span class="mod"><i class="swatch"></i>Moderate 40–69%</span><span class="high"><i class="swatch"></i>High 70–89%</span><span class="crit"><i class="swatch"></i>Critical 90%+</span></div></section><section class="card">${cardHead(sim.running?'Simulated alerts':'Operations alerts',sim.running?'Generated from the simulated station readings':'Prioritised signals for the selected hour',`<button class="btn ghost" data-nav="alerts">View all →</button>`)}${alerts.length?`<div class="alert-list">${alerts.slice(0,6).map(alertCard).join('')}</div>`:empty('No alerts for this snapshot.')}</section></div><div class="grid two section-gap"><section class="card">${cardHead('Service snapshot','A quick read on current conditions')}<div class="grid two"><div class="horizon-card"><div class="label">Highest crowding</div><div class="horizon-value ${rows[0]?band(rows[0].congestion_pct):''}">${rows[0]?pct(rows[0].congestion_pct):'—'}</div><div class="small">${rows[0]?esc(rows[0].station):'No station data'}</div></div><div class="horizon-card"><div class="label">Network scope</div><div class="horizon-value">${rows.length}</div><div class="small">stations returned by your account</div></div></div></section><section class="card">${cardHead('Data context','Understand what this dashboard is showing')}<div class="notice warning">${sim.running?'Simulated-live counts are generated from historical station profiles with variation. They are not real metro observations.':'Historical mode uses a generated Taipei MRT-style dataset. The selected date/hour is not a real-time transit feed.'} Forecasts are model outputs, not guaranteed outcomes.</div></section></div><div class="footer"><span>Last refreshed ${st.refreshAt.toLocaleTimeString()}</span><span>MetroFlow · Operations intelligence</span></div>`
 },
 async heatmap(){const h=await Api.get('/crowd/heatmap',{on_date:$('#date').value});const cells=(h.matrix||[]).map((row,i)=>`<div class="heat-station" title="${esc(h.stations[i])}">${esc(h.stations[i])}</div>`+row.map((v,j)=>{const b=band(v),color={low:'#1e9e6a',mod:'#c49b26',high:'#e87928',crit:'#e24b67'}[b];return `<div class="heat-cell" style="background:${color};opacity:${.25+Math.min(100,v)/135}" title="${esc(h.stations[i])} · ${j}:00 · ${pct(v)}"></div>`}).join('')).join('');return `${pageHead('Crowd heatmap','Compare congestion by station and hour. Hover any cell for details.')}<section class="card">${cardHead('Hourly station intensity',`Recorded entries divided by station capacity · ${esc(h.date)}`)}<div class="heat-wrap"><div class="heatmap"><span></span>${(h.hours||[]).map(x=>`<span class="heat-label">${x}</span>`).join('')}${cells}</div></div><hr class="divider"><div class="legend"><span class="low"><i class="swatch"></i>Low</span><span class="mod"><i class="swatch"></i>Moderate</span><span class="high"><i class="swatch"></i>High</span><span class="crit"><i class="swatch"></i>Critical</span></div></section><div class="notice section-gap">Heatmap values are derived from the selected day's dataset. They are not sensor-based real-time occupancy.</div>`},
 async forecast(){const station=st.station||st.stations[0];if(!station)return pageHead('Forecast & schedules','No stations are available.');const s=enc(station),p={on_date:$('#date').value},hr=Number($('#hour').value);const [demand,delay,fc,sch,recs,peak,forecastAlerts]=await Promise.all([Api.get(`/ai/predict/demand/${s}`,{...p,hour:hr}),Api.get(`/ai/predict/delay/${s}`,{...p,hour:hr}),Api.get(`/ai/forecast/${s}`,p),Api.get(`/schedule/${s}`,p),Api.get(`/ai/recommendations/${s}`,p),Api.get(`/schedule/${s}/peak-summary`,p),Api.get(`/alerts/forecasted/${s}`,p).catch(none)]);const forecast=fc.forecast||[],selected=forecast.find(x=>Number(x.hour)===hr)||forecast[0]||{},cap=Number(demand.capacity||st.capacity[station]||0);const base=Number(demand.predicted_entries||selected.predicted_entries||0);const pctNow=Number(demand.predicted_congestion_pct??selected.predicted_congestion_pct??0);const projected=(mins)=>{const target=hr+mins/60;const lo=Math.floor(target),hi=Math.ceil(target),a=forecast.find(x=>Number(x.hour)===lo),b=forecast.find(x=>Number(x.hour)===hi);if(!a&&!b)return{entries:base,pct:pctNow};if(!b||lo===hi)return{entries:Number((a||b).predicted_entries),pct:Number((a||b).predicted_congestion_pct)};if(!a)return{entries:Number(b.predicted_entries),pct:Number(b.predicted_congestion_pct)};const f=target-lo;return{entries:Number(a.predicted_entries)*(1-f)+Number(b.predicted_entries)*f,pct:Number(a.predicted_congestion_pct)*(1-f)+Number(b.predicted_congestion_pct)*f}};const p15=projected(15),p30=projected(30),range=demand.predicted_entries_90pct_range||selected.predicted_entries_90pct_range||[];const bars=forecast.map(x=>`<div class="schedule-row"><div class="schedule-time">${String(x.hour).padStart(2,'0')}:00</div><div><div class="schedule-line"><i style="width:${Math.min(100,Math.max(0,x.predicted_congestion_pct))}%;background:${({low:'#34d399',mod:'#fbbf24',high:'#fb923c',crit:'#fb7185'})[band(x.predicted_congestion_pct)]}"></i></div><div class="station-sub">${fmt(x.predicted_entries)} entries · ${bandName(x.predicted_congestion_pct)}</div></div><div class="schedule-meta">${pct(x.predicted_congestion_pct)}</div></div>`).join('');return `${pageHead('Forecast & schedules','Inspect model demand, predicted crowding, and recommended train intervals.',`<button class="btn" data-action="export-schedule">Export schedule CSV</button>`)}<section class="card">${cardHead('Choose station','Forecasts and schedules are station-specific',`<div class="select-row"><label for="stationSel">Station</label><select id="stationSel">${st.stations.map(n=>`<option ${n===station?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`)}<div class="grid metrics">${metric('Predicted entries',fmt(base),`Selected model hour · ${String(hr).padStart(2,'0')}:00`,'✦')}${metric('Predicted crowding',pct(pctNow),`90% range: ${range.length?fmt(range[0])+'–'+fmt(range[1])+' entries':'not provided'}`,'◉','high')}${metric('Delay probability',pct(Number(delay.delay_probability||0)*100),`Expected delay ${Number(delay.expected_delay_minutes||0).toFixed(1)} min`,'⌁')}${metric('Recommended interval',`${peak.recommended_peak_frequency_min||'—'} min`,`Peak hour ${peak.peak_hour??'—'}:00`,'↔')}</div><div class="notice">The backend's trained demand model forecasts hourly values. The +15 / +30 minute values below are interpolations between adjacent hourly forecasts, not independently trained 15-minute predictions.</div><div class="grid three section-gap"><article class="horizon-card"><div class="label">Selected model hour · now*</div><div class="horizon-value">${fmt(base)}</div><div class="small">${pct(pctNow)} of station capacity</div></article><article class="horizon-card ${st.horizon===15?'selected':''}"><div class="label">Estimated +15 minutes</div><div class="horizon-value ${band(p15.pct)}">${fmt(p15.entries)}</div><div class="small">${pct(p15.pct)} predicted crowding · interpolated</div></article><article class="horizon-card ${st.horizon===30?'selected':''}"><div class="label">Estimated +30 minutes</div><div class="horizon-value ${band(p30.pct)}">${fmt(p30.entries)}</div><div class="small">${pct(p30.pct)} predicted crowding · interpolated</div></article></div></section><div class="grid split section-gap"><section class="card">${cardHead('Hourly demand forecast','Model forecast across the day',`<span class="pill blue">${forecast.length} points</span>`)}${bars||empty('No forecast points returned.')}</section><section class="card">${cardHead('Recommended train schedule','Suggested service frequency by forecast crowding')}<div class="table-wrap"><table><thead><tr><th>Hour</th><th>Demand</th><th>Crowding</th><th>Interval</th><th>Delay risk</th></tr></thead><tbody>${(sch.schedule||[]).map(r=>`<tr><td>${String(r.hour).padStart(2,'0')}:00</td><td>${fmt(r.predicted_entries)}</td><td class="${band(r.predicted_congestion_pct)}">${pct(r.predicted_congestion_pct)}</td><td>${r.recommended_frequency_min} min</td><td>${pct(Number(r.delay_probability||0)*100)}</td></tr>`).join('')}</tbody></table></div></section></div><div class="grid two section-gap"><section class="card">${cardHead('AI operational recommendations','Model-generated guidance')}<ul>${(recs.recommendations||[]).map(x=>`<li style="margin:9px 0">${esc(x)}</li>`).join('')||'<li class="muted">No recommendations returned.</li>'}</ul></section><section class="card">${cardHead('Forecast crowding alerts','Pre-emptive alerts for this station')}<div class="alert-list">${(forecastAlerts.alerts||[]).map(alertCard).join('')||empty('No forecast alert crosses the backend threshold for this station and date.')}</div></section></div>`},
 async alerts(){const c=ctx();const [over,delays]=await Promise.all([Api.get('/alerts/overcrowding',c).catch(none),Api.get('/alerts/delays',c).catch(none)]);const all=[...(over.alerts||[]),...(delays.alerts||[])].sort((a,b)=>(b.severity==='Critical')-(a.severity==='Critical'));let emergency='';if(st.user?.role==='admin')emergency=`<section class="card section-gap">${cardHead('Emergency announcement','Create an announcement record for a station')}<form id="emergencyForm" class="grid two"><label class="field">Station<select name="station">${st.stations.map(n=>`<option>${esc(n)}</option>`).join('')}</select></label><label class="field">Message<input name="message" minlength="3" maxlength="500" placeholder="Enter operational announcement" required></label><div><button class="btn danger" type="submit">Create announcement</button></div></form><p class="tiny muted">Demo note: this endpoint returns broadcast-channel metadata; it does not actually send SMS or push notifications.</p></section>`;return `${pageHead('Alerts center','Review overcrowding and delay alerts, then respond to operational risk.',`<button class="btn" data-action="refresh">↻ Refresh alerts</button>`)}<div class="grid metrics">${metric('Total alerts',all.length,'Selected date and hour','◉',all.length?'high':'low')}${metric('Overcrowding',over.alerts?.length||0,'Capacity threshold configured at 85%','⚠','high')}${metric('Delay alerts',delays.alerts?.length||0,'Reported delays at 7+ minutes','⌁','mod')}${metric('Critical severity',all.filter(a=>a.severity==='Critical').length,'Highest priority alerts','!',all.some(a=>a.severity==='Critical')?'crit':'low')}</div><section class="card">${cardHead('Current alert feed',`${esc(c.on_date)} · ${String(c.hour).padStart(2,'0')}:00`, `<span class="pill ${all.length?'high':'low'}">${all.length?'Attention required':'No active alerts'}</span>`)}<div class="alert-list">${all.map(alertCard).join('')||empty('No overcrowding or delay alerts for the selected hour.')}</div></section>${emergency}<div class="notice section-gap">Alerts are computed from the dataset and configured thresholds each time this page loads. Automatic background notifications are not configured in this demo.</div>`},
 async simulation(){
  const [sim,hist,events]=await Promise.all([Api.get('/simulation/live'),Api.get('/simulation/history',{limit:100}).catch(()=>({history:[]})),Api.get('/simulation/events',{limit:30}).catch(()=>({events:[]}))]);

  const rows=sim.stations||[],history=hist.history||[],ev=events.events||[];
  const critical=rows.filter(r=>Number(r.congestion_pct)>=90).length,high=rows.filter(r=>Number(r.congestion_pct)>=70).length;

  const stationTable=`<section class="card section-gap">${cardHead('Station live state','Sorted by highest simulated capacity utilisation',`<span class="pill blue">${rows.length} stations</span>`)}<div class="table-wrap"><table><thead><tr><th>Station</th><th>Entries</th><th>Exits</th><th>Net flow</th><th>Capacity</th><th>Congestion</th><th>Status</th><th>Delay</th></tr></thead><tbody>${rows.map(r=>{const p=Number(r.congestion_pct||0),b=band(p);return `<tr><td><b>${esc(r.station)}</b></td><td>${fmt(r.entries)}</td><td>${fmt(r.exits)}</td><td class="${Number(r.net_flow)>=0?'blue':'mod'}">${Number(r.net_flow)>0?'+':''}${fmt(r.net_flow)}</td><td>${fmt(r.capacity)}</td><td><div class="bar" style="min-width:90px"><i class="${b}" style="width:${Math.min(100,p)}%"></i></div><span class="${b}">${pct(p)}</span></td><td><span class="pill ${b}">${bandName(p)}</span></td><td>${Number(r.delay_minutes||0)?`${r.delay_minutes} min`:'—'}</td></tr>`}).join('')||`<tr><td colspan="8">${empty('Start the simulation to populate station readings.')}</td></tr>`}</tbody></table></div></section>`;
  const historyTable=`<section class="card section-gap">${cardHead('Persistent snapshot history','Saved in SQLite and retained across backend restarts',`<button class="btn" data-action="export-simulation">Export CSV</button>`)}<div class="table-wrap"><table><thead><tr><th>Tick</th><th>Timestamp</th><th>Scenario</th><th>Entries</th><th>Exits</th><th>High crowd</th><th>Critical</th><th>Alerts</th></tr></thead><tbody>${history.slice().reverse().slice(0,30).map(h=>`<tr><td>${h.tick}</td><td>${new Date(h.updated_at).toLocaleString()}</td><td>${esc(scenarioNames[h.scenario]||h.scenario)}</td><td>${fmt(h.system_total_entries)}</td><td>${fmt(h.system_total_exits)}</td><td>${h.high_crowd_stations}</td><td class="${Number(h.critical_stations)?'crit':'low'}">${h.critical_stations}</td><td>${h.alert_count}</td></tr>`).join('')||'<tr><td colspan="8">No saved snapshots yet. Start the simulator.</td></tr>'}</tbody></table></div></section>`;
  const eventList=`<section class="card section-gap">${cardHead('Operations audit trail','Simulation start/stop and scenario changes')}<div class="alert-list">${ev.map(e=>`<article class="alert-item"><div class="alert-title"><span>${esc((e.event_type||'event').replaceAll('_',' '))}</span><span class="blue">${new Date(e.created_at).toLocaleString()}</span></div><p>Scenario: ${esc(scenarioNames[e.scenario]||e.scenario)} · ${esc(JSON.stringify(e.details||{}))}</p></article>`).join('')||empty('No control events recorded yet.')}</div></section>`;
  return `${pageHead('Live simulation centre','A controlled digital twin demo for testing station crowding and operational response.',`<button class="btn" data-action="refresh">↻ Refresh</button>`)}<div class="grid metrics">${metric('Simulated entries',fmt(sim.system_total_entries),'Latest snapshot across visible stations','↗')}${metric('Simulated exits',fmt(sim.system_total_exits),'Latest snapshot across visible stations','↙','blue')}${metric('High crowd stations',high,`${critical} critical stations`,'⚠',critical?'crit':'high')}${metric('Generated alerts',(sim.alerts||[]).length,`Tick ${sim.tick||0} · ${sim.running?'updating':'paused'}`,'◉',(sim.alerts||[]).length?'high':'low')}</div>${controls}${stationTable}<div class="grid two section-gap"><section class="card">${cardHead('Current scenario','Synthetic scenario output')}${(sim.alerts||[]).slice(0,8).map(alertCard).join('')||empty('No generated alerts for the current snapshot.')}</section><section class="card">${cardHead('Operator guidance','Use as a sandbox, not as train-control instructions')}<div class="horizon-card"><div class="label">Scenario being tested</div><div class="horizon-value">${esc(scenarioNames[sim.scenario]||sim.scenario||'Normal')}</div><div class="small">Simulated conditions can test alert thresholds and dashboard behaviour. They do not validate actual service capacity or timetables.</div></div><div class="notice section-gap">For real operations, connect an authorised transit data feed and validate every recommendation with operational staff.</div></section></div>${historyTable}${eventList}`;
 },
 async analytics(){const station=st.station||st.stations[0];if(!station)return pageHead('Analytics','No station is available.');const [a,report]=await Promise.all([Api.get(`/crowd/analytics/${enc(station)}`,{days:30}),Api.get(`/analytics/station/${enc(station)}`,{days:30}).catch(()=>({}))]);const profile=a.hourly_profile||[];const max=Math.max(1,...profile.map(x=>Number(x.Entries||x.entries||0)));return `${pageHead('Analytics','Understand station demand patterns and operating context.',`<button class="btn" data-action="export-analytics">Export hourly profile CSV</button>`)}<section class="card">${cardHead('Station analysis',`Last 30 days · ${esc(station)}`,`<div class="select-row"><label for="stationSel">Station</label><select id="stationSel">${st.stations.map(n=>`<option ${n===station?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`)}<div class="grid metrics">${metric('Average daily entries',fmt(a.avg_daily_entries),'30-day average','↗')}${metric('Average daily exits',fmt(a.avg_daily_exits),'30-day average','↙')}${metric('Historical peak hour',`${String(a.peak_hour??'—').padStart(2,'0')}:00`,'Hour with highest average entries','◷')}${metric('Station capacity',fmt(a.capacity||st.capacity[station]),'Entries per hour, configured','▤')}</div><div class="grid two section-gap"><section class="card">${cardHead('Average entries by hour','Historical station profile')}<svg class="spark" viewBox="0 0 720 190" preserveAspectRatio="none" role="img" aria-label="Average entries by hour chart"><line x1="10" y1="165" x2="710" y2="165" stroke="#33465e"/>${profile.map((x,i)=>{const val=Number(x.Entries??x.entries??0),h=val/max*135;return `<rect x="${14+i*29}" y="${165-h}" width="19" height="${h}" rx="4" fill="${i===Number(a.peak_hour)?'#5eead4':'#4389cc'}"><title>${i}:00 · ${fmt(val)} entries</title></rect>`}).join('')}<text x="12" y="184" fill="#8ea2bc" font-size="10">00:00</text><text x="210" y="184" fill="#8ea2bc" font-size="10">06:00</text><text x="384" y="184" fill="#8ea2bc" font-size="10">12:00</text><text x="558" y="184" fill="#8ea2bc" font-size="10">18:00</text></svg></section><section class="card">${cardHead('Operational interpretation','Use historical patterns alongside forecasts')}<div class="horizon-card"><div class="label">Inflow / outflow balance per day</div><div class="horizon-value">${fmt(a.inflow_outflow_balance)}</div><div class="small">Average entries minus exits; not a direct occupancy measure.</div></div><div class="notice section-gap">Historical profiles help identify recurring peaks. They should be combined with current observations before changing service plans.</div></section></div></section>`}
};
async function render(){const v=$('#view');v.innerHTML='<div class="loading"><span class="spinner"></span>Loading operational data…</div>';try{v.innerHTML=await views[st.view]()}catch(e){v.innerHTML=`${pageHead('Unable to load this view','The API returned an error for this request.')}<section class="card"><p class="crit">${esc(e.message)}</p><p class="muted">Check that the FastAPI backend is running and that your account has access to this endpoint.</p><button class="btn" data-action="refresh">Try again</button></section>`}}
async function boot(){st.user=await Api.get('/auth/me');const [health,list,capacity]=await Promise.all([Api.get('/health'),Api.get('/stations'),Api.get('/stations/capacity').catch(()=>({}))]);st.stations=list.stations||[];st.capacity=capacity||{};st.station=st.stations.includes('Taipei Main Station')?'Taipei Main Station':st.stations[0];$('#date').value=health.dataset_latest_date;$('#hour').innerHTML=Array.from({length:24},(_,h)=>`<option value="${h}" ${h===8?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('');$('#who').textContent=`${st.user.full_name} · ${st.user.role}`;$('#login').hidden=true;$('#shell').hidden=false;render();startSimulationPolling()}
let simulationPoll=null;
function startSimulationPolling(){if(simulationPoll)clearInterval(simulationPoll);simulationPoll=setInterval(async()=>{if(!Api.hasToken()||!['overview','simulation'].includes(st.view))return;try{const snap=await Api.get('/simulation/live');if(snap.running){if(snap.tick!==st.simTick)render()}else if(st.simRunning){st.simRunning=false;render()}}catch(_){/* keep the dashboard usable if polling briefly fails */}},3000)}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);$('#loginErr').textContent='';try{await Api.login(f.get('username'),f.get('password'));await boot()}catch(err){$('#loginErr').textContent=err.message}});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;st.view=b.dataset.view;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});$('#date').addEventListener('change',render);$('#hour').addEventListener('change',render);$('#logout').addEventListener('click',()=>{Api.logout();location.reload()});
$('#view').addEventListener('change',e=>{if(e.target.id==='stationSel'){st.station=e.target.value;render()}});$('#view').addEventListener('click',async e=>{const b=e.target.closest('[data-action],[data-nav]');if(!b)return;if(b.dataset.nav){st.view=b.dataset.nav;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x.dataset.view===st.view));render();return}if(b.dataset.action==='refresh'){render();return}if(b.dataset.action==='simulation-start'){try{await Api.get('/simulation/start',{interval_seconds:$('#simulationInterval')?.value||5}, {method:'POST'});st.simRunning=true;toast('Simulated-live stream started.');render()}catch(err){toast(err.message)}return}if(b.dataset.action==='simulation-stop'){try{await Api.get('/simulation/stop',{}, {method:'POST'});st.simRunning=false;toast('Simulation stopped.');render()}catch(err){toast(err.message)}return}if(b.dataset.action==='simulation-scenario'){try{const scenario=$('#simulationScenario')?.value||'normal';await Api.get('/simulation/scenario',{}, {method:'POST',body:JSON.stringify({scenario})});toast('Simulation scenario applied.');render()}catch(err){toast(err.message)}return}if(b.dataset.action==='export-simulation'){try{const data=await Api.get('/simulation/history',{limit:500});downloadCsv('metroflow-simulation-history.csv',data.history||[])}catch(err){toast(err.message)}return}if(b.dataset.action==='export-schedule'){try{const data=await Api.get(`/schedule/${enc(st.station)}`,{on_date:$('#date').value});downloadCsv('metroflow-schedule.csv',data.schedule||[])}catch(err){toast(err.message)}}if(b.dataset.action==='export-analytics'){try{const data=await Api.get(`/crowd/analytics/${enc(st.station)}`,{days:30});downloadCsv('metroflow-hourly-profile.csv',data.hourly_profile||[])}catch(err){toast(err.message)}}});
function downloadCsv(name,rows){if(!rows.length){toast('No rows available to export.');return}const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))],csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);toast('CSV export prepared.')}
$('#view').addEventListener('submit',async e=>{if(e.target.id!=='emergencyForm')return;e.preventDefault();const f=new FormData(e.target);try{const result=await Api.get('/alerts/emergency',{}, {method:'POST',body:JSON.stringify({station:f.get('station'),message:f.get('message')})});toast(`Announcement record created for ${result.station}.`);render()}catch(err){toast(err.message)}});
if(Api.hasToken())boot().catch(()=>{Api.logout();$('#login').hidden=false});
</script></body></html>
