name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t metroflow/backend:test ./backend

      - name: Run backend test suite inside the image (pinned deps)
        run: >
          docker run --rm
          -e DATABASE_URL=sqlite:///./test_metroflow.db
          -e MONGODB_URL=
          -e REDIS_URL=
          -e CUDA_VISIBLE_DEVICES=
          metroflow/backend:test
          python -m pytest tests -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build