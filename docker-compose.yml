version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: metroflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metroflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      # Named volume ensures data persists across container restarts and updates
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-metroflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - metroflow-network

  # ============================================================================
  # 2. Redis Cache Service
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: metroflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - metroflow-network

  # ============================================================================
  # 3. FastAPI Backend API Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metroflow-backend
    restart: unless-stopped
    environment:
      - PROJECT_NAME=MetroFlow
      - ENVIRONMENT=production
      # Reaches Postgres and Redis over Docker internal DNS network
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-metroflow_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-metroflow-super-secret-jwt-key-change-in-production-2026}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - MODEL_PATH=/app/crowd_prediction_rf_compressed.pkl
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173"]
    volumes:
      - ./crowd_prediction_rf_compressed.pkl:/app/crowd_prediction_rf_compressed.pkl:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - metroflow-network

  # ============================================================================
  # 4. React + Nginx Frontend Service
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metroflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - metroflow-network

# ==============================================================================
# Persistent Volumes & Private Bridge Network
# ==============================================================================
volumes:
  postgres_data:
    name: metroflow_postgres_data

networks:
  metroflow-network:
    name: metroflow_network
    driver: bridge
