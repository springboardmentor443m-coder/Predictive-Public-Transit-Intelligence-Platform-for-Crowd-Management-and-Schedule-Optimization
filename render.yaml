services:
  - type: web
    name: metroflow-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: metroflow
      - key: METROFLOW_JWT_SECRET
        sync: false
      - key: METROFLOW_ADMIN_PASSWORD
        sync: false
      - key: METROFLOW_OPERATOR_PASSWORD
        sync: false
      - key: METROFLOW_JWT_EXPIRY_HOURS
        value: "8"
      - key: ALLOWED_ORIGINS
        sync: false
